# waylake dotfiles — tmux (3.2+)
#
# 이 파일은 링크하지 않는다. 각 머신의 ~/.config/tmux/tmux.conf 에 한 줄만 넣는다:
#   source-file ~/dotfiles/tmux/tmux.conf
# 그 머신에만 필요한 설정은 그 한 줄 아래에 둔다.
# 키 정리는 README.md 의 「tmux 키」 표에 있다. prefix 는 Ctrl-t.

# ── 기본 ────────────────────────────────────────────────
unbind C-b
set -g prefix C-t
bind C-t send-prefix                  # Ctrl-t 두 번: 안쪽(원격) tmux 나 프로그램에 Ctrl-t 전달

set -g default-terminal "xterm-256color"
set -as terminal-features ',xterm*:RGB'   # 트루컬러
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -sg escape-time 10
set -g repeat-time 500                # 같은 키(-r)를 prefix 없이 이어서 누를 수 있는 시간
set -g renumber-windows on            # 창을 닫으면 번호를 다시 붙인다
set -g set-titles on
set -g set-titles-string "#T"

# ── 복사: vi 키 + OSC 52 ────────────────────────────────
# 바깥 터미널(맥의 Ghostty·iTerm 등) 클립보드로 보낸다. ssh 너머 서버에서도 그대로 동작.
setw -g mode-keys vi
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# ── 창·패널 ─────────────────────────────────────────────
# 새 창·분할은 지금 패널의 폴더에서 연다
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# 패널 이동 h j k l, 크기 조절 H J K L (prefix 후 연속 입력 가능)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind e kill-pane -a                   # 지금 패널만 남기고 닫기
bind -r < swap-window -d -t -1        # 창 순서 왼쪽으로
bind -r > swap-window -d -t +1        # 창 순서 오른쪽으로
bind -n C-S-Left  swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1

bind r source-file ~/.config/tmux/tmux.conf \; display "설정 다시 읽음"

# ── 팝업 (없는 도구는 안내만) ───────────────────────────
bind g if-shell 'command -v lazygit >/dev/null' \
  "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit" \
  "display 'lazygit 이 없다'"

# 폴더별 Claude Code 세션을 팝업으로 연다. 닫아도(prefix d) 세션은 살아 있어서 다시 열면 이어진다.
bind y if-shell 'command -v claude >/dev/null' {
  display-popup -d '#{pane_current_path}' -w 90% -h 90% -E "TMUX= tmux new-session -A -s 'claude-#{s/[.]/_/:#{b:pane_current_path}}' claude"
} {
  display 'claude 가 없다'
}

# ── 모양: Solarized, Nerd Font 없이도 깨지지 않게 ────────
set -g status-interval 5
set -g status-style "fg=#93a1a1,bg=#002b36"
set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"
set -g mode-style "fg=#eee8d5,bg=#073642"
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#b58900"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#002b36,bg=#eee8d5,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[fg=#002b36 bg=#b58900 bold] PREFIX #[default] ,}#[fg=#002b36,bg=#93a1a1,bold] #h "
setw -g window-status-separator ""
setw -g window-status-format " #I #{b:pane_current_path} "
setw -g window-status-current-format "#[fg=#002b36,bg=#b58900,bold] #I #{b:pane_current_path} "
setw -g window-status-activity-style "underscore"

# undercurl(물결 밑줄) — 지원하지 않는 터미널에서는 무시된다
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
